[package]
name = "verisocial_be"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.10.2"
actix-cors = "0.7"
actix-multipart = "0.7.2"
sanitize-filename="0.6.0"
actix-web-httpauth = "0.8.2"
aws-sdk-s3 = {version = "1.82.0", features = ["behavior-version-latest"]}
aws-config = {version = "1.6.1", features = ["behavior-version-latest"]}
bytes = "1.7.2"
mime = "0.3.17"
jsonwebtoken = "9.3.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.139"
env_logger = "0.11.5"
log = "0.4.26"
dotenvy = "0.15.7"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.12.0", features = ["serde", "v4"] }
argon2 = "0.5.3"
sqlx = { version = "0.8.3", features = ["mysql", "runtime-tokio", "chrono"] }
tokio = { version = "1.44.2", features = ["fs"]}
lazy_static = "1.5.0"
reqwest = {version ="0.12.11", features = ["json"]}