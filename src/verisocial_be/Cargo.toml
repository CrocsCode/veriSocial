[package]
name = "verisocial_be"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
actix-cors = "0.7"
actix-web-httpauth = "0.8.2"
jsonwebtoken = "9.3.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
env_logger = "0.11.5"
log = "0.4.26"
config = "0.15.6"
dotenvy = "0.15.7"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.12.0", features = ["serde", "v4"] }
argon2 = "0.5.3"
sqlx = { version = "0.8.3", features = ["mysql", "runtime-tokio", "chrono"] }
tokio = { version = "1.43.0", features = ["fs"]}
lazy_static = "1.5.0"
reqwest = {version ="0.12.11", features = ["json"]}