# for ensemble.py (detector algorithm weighting)
anomaly:
  weights:
    one_class_svm: 0.5
    lof: 0.5
    isolation_forest: 2.0
  threshold: 0.0
# for updating bot score
update:
  bot_multiplier: 0.2 # what to multiply each pred by when updating bot_score
  human_multiplier: 0.01
# DB details:
database: # MUST BE PROVIDED OR CRASH
  host: localhost
  port: 3306
  user: root
  password: my-secret-pw
  name: mydatabase

time_interval:
  minutes: 5
