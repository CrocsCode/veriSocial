version: "3.8"

services:
  backend:
    image: cr0c0dile07/final-year-project:backend
    container_name: backend
    depends_on:
      - database
    environment:
      APP_URL: '0.0.0.0'
      APP_DATABASE_URL: 'mysql://root:my-secret-pw@database:3306/mydatabase'
      AI_IMAGE_CHECKER_URL: 'http://ai-detection:8000/classify'
      AUTH_SECRET: "XXIwRXPJkwNQrDIcJQzPjus60LsVY5ku"
    ports:
      - 8080:8080

  frontend:
    image: cr0c0dile07/final-year-project:frontend
    container_name: frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: 'http://139.59.175.54:8080/'
    ports:
      - 80:80

  database:
    image: mysql:latest
    container_name: database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: mydatabase
    ports:
      - 3306:3306