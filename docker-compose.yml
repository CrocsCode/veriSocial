version: "3.8"

services:
  backend:
    image: cr0c0dile07/final-year-project:backend
    container_name: backend
    volumes:
     - ./config.yaml:/usr/src/app/config.yaml
    ports:
      - 8080:8080

  frontend:
    image: cr0c0dile07/final-year-project:frontend
    container_name: frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: 'backend'
    ports:
      - 80:80
