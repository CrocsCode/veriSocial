stages:
  - lint
  - build
  - test

# Linting Stage
rust-lint:
  stage: lint
  image: rust:latest
  script:
    - cargo clippy

lint_node:
  image: node:23-alpine
  stage: lint
  script:
    - cd src/web
    - npm install
    - npm run lint


# Build stage
