#    paths:
#      - target/release/verisocial_be

build_node:
  image: node:23-alpine
  stage: build
  script:
    - cd src/web
    - npm install
    - npm run build
  artifacts:
    paths:
      - src/web/out/*


# Test Stage
test_node:
  image: node:23-alpine
  stage: test
  script:
    - cd src/web
    - npm install
    - npm run test

rust-tests:
  stage: test
  image: rust:latest
  script:
    - cargo test --verbose