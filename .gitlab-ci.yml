# Build Stage
rust-build:
  stage: build
  image: rust:1.85.0-alpine
  script:
    - apk add --no-cache alpine-sdk openssl-dev libssl3 openssl-libs-static
    - cargo build --workspace --release
  artifacts:
    paths:
      - target/release/verisocial_be

build_node:
  image: node:23-alpine
  stage: build
  script:
    - cd src/verisocial_fe
    - npm install
    - npm run build
  artifacts:
    paths:
      - src/web/out/*
