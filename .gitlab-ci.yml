stages:
  - build
  - test

# Build stage
rust-build:
  stage: build
  image: rust:1.85.0-alpine
  script:
    - apk add alpine-sdk openssl-dev libssl3 # Dependency for the binary
    - cargo build --workspace --release
  artifacts:
    paths:
      - target/release/verisocial_be

# Test Stage
rust-tests:
  stage: test
  image: rust:latest
  script:
    - cargo test --verbose